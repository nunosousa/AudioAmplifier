<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title description">
  <title id="title">Compact 2.1 amplifier front-panel concept</title>
  <desc id="description">Five labeled push-turn controls with units, a compact bank of individual LED segment digits showing only the adjusted value, and separate system-status indicators.</desc>
  <defs>
    <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#343c43"/>
      <stop offset="1" stop-color="#171b1e"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8c59a"/>
      <stop offset=".5" stop-color="#9f895e"/>
      <stop offset="1" stop-color="#62543b"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#858276"/>
      <stop offset=".55" stop-color="#4f504d"/>
      <stop offset="1" stop-color="#242725"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="570" fill="#e9e5dc"/>
  <text x="640" y="34" text-anchor="middle" fill="#343a3b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">2.1 AMPLIFIER · SIMPLIFIED FRONT-PANEL STUDY</text>

  <rect x="30" y="55" width="1220" height="470" rx="18" fill="url(#face)" stroke="#756b56" stroke-width="3" filter="url(#shadow)"/>
  <rect x="39" y="64" width="1202" height="452" rx="13" fill="none" stroke="#c3b38d" stroke-opacity=".62"/>
  <text x="68" y="99" fill="#d5c59d" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">STEREO  /  SUBWOOFER AMPLIFIER</text>
  <path d="M68 113 H1210" stroke="#74694f" stroke-width="1"/>

  <g font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing=".7">
    <circle cx="934" cy="91" r="5" fill="#8bd28c" filter="url(#glow)"/><text x="934" y="108" fill="#b9b29f">POWER</text>
    <circle cx="1020" cy="91" r="5" fill="#8bd28c" filter="url(#glow)"/><text x="1020" y="108" fill="#b9b29f">DSP READY</text>
    <circle cx="1104" cy="91" r="5" fill="#777b72"/><text x="1104" y="108" fill="#b9b29f">MUTE</text>
    <circle cx="1184" cy="91" r="5" fill="#777b72"/><text x="1184" y="108" fill="#b9b29f">FAULT*</text>
  </g>

  <rect x="397" y="132" width="486" height="156" rx="12" fill="#101512" stroke="url(#brass)" stroke-width="3"/>
  <text x="640" y="158" text-anchor="middle" fill="#b9b29f" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">VALUE DISPLAY · INDIVIDUAL LED SEGMENTS</text>
  <rect x="514" y="174" width="252" height="83" rx="7" fill="#080d0b" stroke="#38453b" stroke-width="2"/>
  <g transform="translate(548 180)">
    <g transform="translate(0 0)">
      <g fill="#27352b">
        <path d="M6 0 H30 L26 4 H10 Z M34 6 L30 10 V31 L34 35 Z M30 39 L34 43 V64 L30 68 Z M6 72 H30 L26 68 H10 Z M2 39 L6 43 V64 L2 68 Z M6 6 L2 10 V31 L6 35 Z"/>
        <path d="M6 36 H30 L26 32 H10 Z" fill="#71e69a" filter="url(#glow)"/>
      </g>
    </g>
    <g transform="translate(52 0)">
      <g fill="#27352b">
        <path d="M6 0 H30 L26 4 H10 Z M34 6 L30 10 V31 L34 35 Z M30 39 L34 43 V64 L30 68 Z M6 72 H30 L26 68 H10 Z M2 39 L6 43 V64 L2 68 Z M6 6 L2 10 V31 L6 35 Z M6 36 H30 L26 32 H10 Z"/>
      </g>
      <g fill="#71e69a" filter="url(#glow)">
        <path d="M6 0 H30 L26 4 H10 Z M34 6 L30 10 V31 L34 35 Z M30 39 L34 43 V64 L30 68 Z M6 72 H30 L26 68 H10 Z M2 39 L6 43 V64 L2 68 Z M6 36 H30 L26 32 H10 Z"/>
        <circle cx="40" cy="68" r="3.5"/>
      </g>
    </g>
    <g transform="translate(104 0)">
      <g fill="#27352b">
        <path d="M6 0 H30 L26 4 H10 Z M34 6 L30 10 V31 L34 35 Z M30 39 L34 43 V64 L30 68 Z M6 72 H30 L26 68 H10 Z M2 39 L6 43 V64 L2 68 Z M6 6 L2 10 V31 L6 35 Z M6 36 H30 L26 32 H10 Z"/>
      </g>
      <g fill="#71e69a" filter="url(#glow)">
        <path d="M6 0 H30 L26 4 H10 Z M34 6 L30 10 V31 L34 35 Z M30 39 L34 43 V64 L30 68 Z M6 72 H30 L26 68 H10 Z M2 39 L6 43 V64 L2 68 Z M6 6 L2 10 V31 L6 35 Z"/>
      </g>
    </g>
  </g>
  <text x="640" y="306" text-anchor="middle" fill="#b9b29f" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.2">VALUE SHOWN WHILE PRESSING AND TURNING A CONTROL</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(160 400)">
      <circle r="38" fill="#202523" stroke="#8c7c59" stroke-width="2"/><circle r="30" fill="url(#knob)" stroke="#aaa083" stroke-width="1.5"/>
      <path d="M0 -27 V-18" stroke="#e8dcc0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cy="3" r="7" fill="#171b18" stroke="#948765"/>
      <text y="57" fill="#eee7d4" font-size="11" font-weight="700" letter-spacing=".8">MASTER [dB]</text>
    </g>
    <g transform="translate(400 400)">
      <circle r="38" fill="#202523" stroke="#8c7c59" stroke-width="2"/><circle r="30" fill="url(#knob)" stroke="#aaa083" stroke-width="1.5"/>
      <path d="M0 -27 V-18" stroke="#e8dcc0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cy="3" r="7" fill="#171b18" stroke="#948765"/>
      <text y="57" fill="#eee7d4" font-size="11" font-weight="700" letter-spacing=".8">BASS [dB]</text>
    </g>
    <g transform="translate(640 400)">
      <circle r="38" fill="#202523" stroke="#8c7c59" stroke-width="2"/><circle r="30" fill="url(#knob)" stroke="#aaa083" stroke-width="1.5"/>
      <path d="M0 -27 V-18" stroke="#e8dcc0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cy="3" r="7" fill="#171b18" stroke="#948765"/>
      <text y="57" fill="#eee7d4" font-size="11" font-weight="700" letter-spacing=".8">TREBLE [dB]</text>
    </g>
    <g transform="translate(880 400)">
      <circle r="38" fill="#202523" stroke="#8c7c59" stroke-width="2"/><circle r="30" fill="url(#knob)" stroke="#aaa083" stroke-width="1.5"/>
      <path d="M0 -27 V-18" stroke="#e8dcc0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cy="3" r="7" fill="#171b18" stroke="#948765"/>
      <text y="57" fill="#eee7d4" font-size="11" font-weight="700" letter-spacing=".8">SUB LEVEL [dB]</text>
    </g>
    <g transform="translate(1120 400)">
      <circle r="38" fill="#202523" stroke="#8c7c59" stroke-width="2"/><circle r="30" fill="url(#knob)" stroke="#aaa083" stroke-width="1.5"/>
      <path d="M0 -27 V-18" stroke="#e8dcc0" stroke-width="3.5" stroke-linecap="round"/>
      <circle cy="3" r="7" fill="#171b18" stroke="#948765"/>
      <text y="57" fill="#eee7d4" font-size="10" font-weight="700" letter-spacing=".5">CROSSOVER [Hz]</text>
    </g>
  </g>
  <text x="640" y="488" text-anchor="middle" fill="#c6bd9f" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">PRESS + TURN TO ADJUST  ·  RELEASE WHEN DONE</text>
  <text x="640" y="548" text-anchor="middle" fill="#777568" font-family="Arial, sans-serif" font-size="10" letter-spacing=".8">CONCEPT ONLY · 5 CONTROLS · COMPACT 7-SEGMENT VALUE DISPLAY · STATUS LEDs</text>
  <text x="1243" y="538" text-anchor="end" fill="#777568" font-family="Arial, sans-serif" font-size="8">*FAULT INDICATOR ONLY IF MONITORED</text>
</svg>
