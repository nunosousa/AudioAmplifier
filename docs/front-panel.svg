<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="650" viewBox="0 0 1360 650" role="img" aria-labelledby="title description">
  <title id="title">AudioAmplifier RGB matrix front-panel concept</title>
  <desc id="description">Retro amplifier front panel with five rotary controls and an RGB LED panel. The main panel shows a spectrogram. Insets show VU meter, blank, and contextual knob-adjustment display modes. The proposed MCU direction is RP2040.</desc>
  <defs>
    <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#343c43"/>
      <stop offset="1" stop-color="#171b1e"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8c59a"/>
      <stop offset=".5" stop-color="#9f895e"/>
      <stop offset="1" stop-color="#62543b"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#858276"/>
      <stop offset=".55" stop-color="#4f504d"/>
      <stop offset="1" stop-color="#242725"/>
    </radialGradient>
    <pattern id="pixels" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="1.5" width="8" height="8" rx="1.1" fill="#222b27" stroke="#303b34" stroke-width=".55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
