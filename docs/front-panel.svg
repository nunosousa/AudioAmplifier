<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title description">
  <title id="title">AudioAmplifier 2.1 front-panel concept</title>
  <desc id="description">Five rotary encoders labeled Master, Bass, Treble, Sub Level, and Crossover. A shared four-digit display is identified by five parameter LEDs. Power, DSP Ready, Mute, and Fault status indicators are at upper right.</desc>
  <defs>
    <linearGradient id="face" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#333b48"/>
      <stop offset="1" stop-color="#171c24"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#758293"/>
      <stop offset="0.55" stop-color="#46515f"/>
      <stop offset="1" stop-color="#252c36"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1000" height="470" fill="#eef1f4"/>
  <text x="500" y="34" text-anchor="middle" fill="#26313d" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">AUDIOAMPLIFIER  ·  2.1 FRONT PANEL CONCEPT</text>
  <rect x="34" y="58" width="932" height="372" rx="22" fill="url(#face)" stroke="#596574" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="96" fill="#dbe4ed" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">STEREO  /  SUBWOOFER AMPLIFIER</text>

  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing=".7">
    <circle cx="676" cy="90" r="5" fill="#5ed59a"/><text x="676" y="110" fill="#bac5d1">POWER</text>
    <circle cx="754" cy="90" r="5" fill="#5ed59a"/><text x="754" y="110" fill="#bac5d1">DSP READY</text>
    <circle cx="840" cy="90" r="5" fill="#8793a1"/><text x="840" y="110" fill="#bac5d1">MUTE</text>
    <circle cx="918" cy="90" r="5" fill="#8793a1"/><text x="918" y="110" fill="#bac5d1">FAULT</text>
  </g>

  <rect x="350" y="126" width="300" height="118" rx="10" fill="#101914" stroke="#718071" stroke-width="2"/>
  <rect x="361" y="137" width="278" height="96" rx="5" fill="#17231c"/>
  <text x="492" y="185" text-anchor="middle" fill="#8ef0ad" font-family="monospace" font-size="49" font-weight="700" letter-spacing="8">-12</text>
  <text x="602" y="183" text-anchor="middle" fill="#8ef0ad" font-family="Arial, sans-serif" font-size="15" font-weight="700">dB</text>
  <text x="500" y="219" text-anchor="middle" fill="#9ab4a1" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.5">VALUE OF LAST-ADJUSTED CONTROL</text>

  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <g transform="translate(378 264)"><circle r="5" fill="#79dfff"/><text y="19" fill="#d4dee8">MASTER</text></g>
    <g transform="translate(432 264)"><circle r="5" fill="#52606d"/><text y="19" fill="#d4dee8">BASS</text></g>
    <g transform="translate(486 264)"><circle r="5" fill="#52606d"/><text y="19" fill="#d4dee8">TREBLE</text></g>
    <g transform="translate(540 264)"><circle r="5" fill="#52606d"/><text y="19" fill="#d4dee8">SUB</text></g>
    <g transform="translate(600 264)"><circle r="5" fill="#52606d"/><text y="19" fill="#d4dee8">CROSSOVER</text></g>
  </g>

  <g transform="translate(115 326)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle r="47" fill="#202731" stroke="#536070" stroke-width="2"/>
    <circle r="37" fill="url(#knob)" stroke="#8995a2" stroke-width="1.5"/>
    <path d="M0,-33 L0,-20" stroke="#e9f1f8" stroke-width="4" stroke-linecap="round"/>
    <circle cy="4" r="10" fill="#11171e" stroke="#718090"/>
    <path d="M-5,4 h10 M0,-1 v10" stroke="#d4dce4" stroke-width="1.5"/>
    <text y="69" fill="#f3f6f9" font-size="13" font-weight="700" letter-spacing="1">MASTER</text>
    <text y="87" fill="#aebac7" font-size="10">PUSH: MUTE</text>
  </g>
  <g transform="translate(307 326)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle r="47" fill="#202731" stroke="#536070" stroke-width="2"/>
    <circle r="37" fill="url(#knob)" stroke="#8995a2" stroke-width="1.5"/>
    <path d="M0,-33 L0,-20" stroke="#e9f1f8" stroke-width="4" stroke-linecap="round"/>
    <text y="69" fill="#f3f6f9" font-size="13" font-weight="700" letter-spacing="1">BASS</text>
    <text y="87" fill="#aebac7" font-size="10">TONE</text>
  </g>
  <g transform="translate(500 326)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle r="47" fill="#202731" stroke="#536070" stroke-width="2"/>
    <circle r="37" fill="url(#knob)" stroke="#8995a2" stroke-width="1.5"/>
    <path d="M0,-33 L0,-20" stroke="#e9f1f8" stroke-width="4" stroke-linecap="round"/>
    <text y="69" fill="#f3f6f9" font-size="13" font-weight="700" letter-spacing="1">TREBLE</text>
    <text y="87" fill="#aebac7" font-size="10">TONE</text>
  </g>
  <g transform="translate(693 326)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle r="47" fill="#202731" stroke="#536070" stroke-width="2"/>
    <circle r="37" fill="url(#knob)" stroke="#8995a2" stroke-width="1.5"/>
    <path d="M0,-33 L0,-20" stroke="#e9f1f8" stroke-width="4" stroke-linecap="round"/>
    <text y="69" fill="#f3f6f9" font-size="13" font-weight="700" letter-spacing="1">SUB LEVEL</text>
    <text y="87" fill="#aebac7" font-size="10">TRIM</text>
  </g>
  <g transform="translate(885 326)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle r="47" fill="#202731" stroke="#536070" stroke-width="2"/>
    <circle r="37" fill="url(#knob)" stroke="#8995a2" stroke-width="1.5"/>
    <path d="M0,-33 L0,-20" stroke="#e9f1f8" stroke-width="4" stroke-linecap="round"/>
    <text y="69" fill="#f3f6f9" font-size="13" font-weight="700" letter-spacing="1">CROSSOVER</text>
    <text y="87" fill="#aebac7" font-size="10">FREQUENCY</text>
  </g>

  <text x="500" y="418" text-anchor="middle" fill="#7f8c99" font-family="Arial, sans-serif" font-size="11">CONCEPT ONLY · NOT TO SCALE · DISPLAY UNITS AND VALUE RANGES TBD</text>
</svg>
